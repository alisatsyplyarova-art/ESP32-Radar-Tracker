name: Package ESP32 Radar Tracker firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/ESP32_Radar_Tracker/**'
      - '.github/workflows/package-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify firmware version
        run: |
          grep -q '#define FIRMWARE_VERSION "1.1.30"' firmware/ESP32_Radar_Tracker/Version.h
          grep -q '1.1.30' firmware/ESP32_Radar_Tracker/VERSION.txt
      - name: Create versioned ZIP
        run: |
          mkdir -p package/ESP32-Radar-Tracker-1.1.30
          cp -R firmware/ESP32_Radar_Tracker/. package/ESP32-Radar-Tracker-1.1.30/
          zip -r ESP32-Radar-Tracker-1.1.30.zip package/ESP32-Radar-Tracker-1.1.30
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-Radar-Tracker-1.1.30
          path: ESP32-Radar-Tracker-1.1.30.zip
          if-no-files-found: error
