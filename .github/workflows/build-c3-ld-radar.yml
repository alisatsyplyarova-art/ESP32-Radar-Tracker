name: Build ESP32-C3 LD-Radar

on:
  push:
    branches: [ESP32-C3-LD-Radar]
    paths:
      - 'firmware/ESP32_C3_LD_Radar_0.1.0/**'
      - '.github/workflows/build-c3-ld-radar.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Configure ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - name: Install TFT library
        run: arduino-cli lib install TFT_eSPI@2.5.43
      - name: Compile C3 firmware
        run: |
          arduino-cli compile --verbose --fqbn esp32:esp32:esp32c3 firmware/ESP32_C3_LD_Radar_0.1.0
